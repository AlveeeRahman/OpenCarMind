name: pages

# Publishes the GitHub Pages site on every push to main that touches it:
#   docs/                       the landing page, https://alveeerahman.github.io/OpenCarMind/
#   docs-src/ built by Sphinx   the documentation, https://alveeerahman.github.io/OpenCarMind/docs/
# and, for other websites that show the documentation, two files next to it:
#   docs/opencarmind-docs.tar.gz   the whole built site, relative links only, works from any sub-path
#   docs/docs-version.json         {"commit", "built", "versions": {"s3", "s3_beta", "mosaico"}}
#
# One click is needed once: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". The workflow token may deploy to an existing Pages site but
# may not create one, so until that is done the `check` job reports that Pages
# is off and the `deploy` job is skipped; every run after it deploys on its own.
on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/images/**"
      - "docs/assets/**"
      - "docs/sitemap.xml"
      - "docs/manual/**"
      - "docs/robots.txt"
      - "docs/.nojekyll"
      - "docs-src/**"
      - "**.md"
      - "main/**.h"
      - "tools/**.py"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled; deploying docs/." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages is not enabled::Settings > Pages > Build and deployment > Source: GitHub Actions. Nothing was deployed."
            echo "Pages is not enabled for this repository, so nothing was deployed. Turn it on under Settings > Pages (Source: GitHub Actions) and re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the documentation
        run: |
          pip install --require-hashes -r docs-src/requirements.txt
          sphinx-build -W --keep-going -b html docs-src docs-src/_build/html
      - name: Put the landing page and the documentation together
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          test ! -e _site/docs
          cp -R docs-src/_build/html _site/docs
          rm -rf _site/docs/.doctrees _site/docs/.buildinfo
          python docs-src/package.py docs-src/_build/html _site/docs
          python docs-src/package.py --check _site/docs/opencarmind-docs.tar.gz /docs/opencarmind/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
