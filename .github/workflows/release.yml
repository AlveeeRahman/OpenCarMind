name: release

# Push a tag such as v2.1.0 to build the firmware and the desktop app, and publish both as one GitHub release with
# SHA-256 sums and build provenance. Run it by hand (workflow_dispatch) to build everything without publishing.
# The release notes are the tag's section of CHANGELOG.md, so a tag with no section stops before anything is built.
# The desktop jobs follow the owner's mr-usage release workflow and https://v2.tauri.app/distribute/pipelines/github/.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="$(cat version.txt)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version.txt ($version)"; exit 1
          fi
          awk -v v="## $version" '$0 == v {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section '## $version'"; exit 1; }
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  firmware:
    needs: notes
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container's default shell is sh; ESP-IDF's export.sh needs bash.
      - name: Build the firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          version="$(cat version.txt)"
          mkdir -p out
          cd build
          python -m esptool --chip esp32s3 merge-bin -o "../out/opencarmind-$version-firmware-merged.bin" @flash_args
          cp opencarmind.bin "../out/opencarmind-$version-firmware-app.bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: out/

  desktop:
    needs: notes
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: linux
            platform: ubuntu-22.04
            args: ""
          - name: windows
            platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Unit tests
        run: cargo test --manifest-path desktop/app/src-tauri/Cargo.toml
      - name: Install the Tauri CLI
        working-directory: desktop/app
        run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/app/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/app/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/app/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/app/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/app/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/app/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [notes, firmware, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance with this workflow's identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect the files and their SHA-256 sums
        run: |
          mkdir release
          find artifacts -type f ! -name notes.md -exec cp {} release/ \;
          cd release
          ls -l
          [ "$(ls | wc -l)" -ge 9 ] || { echo "::error::expected at least 9 files, found $(ls | wc -l)"; exit 1; }
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenCarMind ${GITHUB_REF_NAME#v}" --notes-file artifacts/notes/notes.md
