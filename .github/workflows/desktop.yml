name: desktop

# Builds the desktop app for Windows, macOS (Apple silicon and Intel) and Linux, runs its unit tests, and uploads the
# installers as workflow artifacts. Run it by hand (workflow_dispatch) or push a change under desktop/app.
# The workflow shape follows the owner's mr-usage release workflow and https://v2.tauri.app/distribute/pipelines/github/.
# The installers are not code-signed: macOS and Windows will warn on first launch.

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/app/**"
      - "desktop/icons/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
          - name: macos-intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            triple: x86_64-apple-darwin
          - name: linux
            platform: ubuntu-22.04
            args: ""
            triple: x86_64-unknown-linux-gnu
          - name: windows
            platform: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libudev-dev rpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/app/src-tauri
      - name: Bundle esptool (pinned by SHA-256)
        shell: bash
        run: |
          bash desktop/app/scripts/fetch-esptool.sh "${{ matrix.triple }}"
          # the unit tests build for the runner itself, which is Apple silicon on both macOS jobs
          if [ "$RUNNER_OS" = "macOS" ]; then bash desktop/app/scripts/fetch-esptool.sh aarch64-apple-darwin; fi
      - name: Firmware image to bundle (from the latest release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-firmware-merged.bin' --dir fw
          cp fw/*-firmware-merged.bin desktop/app/src-tauri/resources/opencarmind-firmware.bin
          basename fw/*-firmware-merged.bin | sed 's/^opencarmind-//; s/-firmware-merged.bin$//' > desktop/app/src-tauri/resources/firmware-version.txt
      - name: Unit tests
        run: cargo test --manifest-path desktop/app/src-tauri/Cargo.toml
      - name: Install the Tauri CLI
        working-directory: desktop/app
        run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencarmind-desktop-${{ matrix.name }}
          path: |
            desktop/app/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/app/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/app/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/app/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/app/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/app/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
