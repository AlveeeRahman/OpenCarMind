# CarMind-Former, CUDA training on Kind 1 (OBD signals) + Kind 2 (CAN rate series)
model:
  window: 256
  patch: 8
  d_model: 192
  n_heads: 6
  n_blocks: 6
  d_ff: 512
  dropout: 0.1
  max_channels: 48
  mask_ratio: 0.4
  n_drivers: 10
loss:
  recon: 1.0
  change: 1.0
  contrast: 0.5
  attack: 1.0
  driver: 0.2
train:
  epochs: 40
  steps_per_epoch: 400
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.05
  workers: 6
