# Small CarMind-Former for pipeline validation on real data (Mac MPS / CPU). Not the model to report.
model:
  window: 128
  patch: 8
  d_model: 64
  n_heads: 4
  n_blocks: 3
  d_ff: 128
  dropout: 0.1
  max_channels: 24
  mask_ratio: 0.4
  n_drivers: 10
loss: {recon: 1.0, change: 1.0, contrast: 0.5, attack: 1.0, driver: 0.2}
train: {epochs: 4, steps_per_epoch: 150, batch_size: 32, lr: 0.0005, weight_decay: 0.05, workers: 0}
