<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wi-Fi link to the desktop app</title>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Wi-Fi link to the desktop app: Pair once over USB. After that the board sends new drive data whenever it is parked at home." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="686" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">Wi-Fi link to the desktop app</text><text x="44" y="102" font-size="23" fill="#334e68">Pair once over USB. After that the board sends new drive data whenever it is parked at home.</text><rect x="170" y="140" width="260" height="64" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="300.0" y="180.1" data-w="260" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Board</text><rect x="770" y="140" width="260" height="64" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="900.0" y="180.1" data-w="260" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Desktop app</text><path d="M300 204 V650 M900 204 V650" stroke="#bcccdc" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M 898 260 L 302 260" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="247" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">over USB: the pairing code from the board's screen</text><path d="M 898 316 L 302 316" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="303" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">the app's certificate, a token, your Wi-Fi</text><rect x="50" y="340" width="230" height="54" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="165.0" y="373.6" data-w="230" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">kept in flash</text><path d="M50 424 H1150" stroke="#bcccdc" stroke-width="2"/><text x="600" y="432" text-anchor="middle" font-size="22" font-weight="700" fill="#627d98" stroke="#ffffff" stroke-width="12" paint-order="stroke">later: engine off, parked near home</text><path d="M 302 480 L 898 480" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="467" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">TLS, app's certificate only: what do you have?</text><path d="M 898 532 L 302 532" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="519" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">the bytes it already holds, per file</text><path d="M 302 584 L 898 584" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="571" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">the rest, appended</text><path d="M935 455 H960 V600 H935" fill="none" stroke="#627d98" stroke-width="2.5"/><text x="975" y="535" text-anchor="start" font-size="22" font-weight="700" fill="#627d98">every 10 s</text><text x="600" y="652" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">A cut-off pass resumes from the last byte the app has. Nothing is lost or stored twice.</text></svg>
