<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Local-first</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Local-first: What stays in the car, what goes home, and the one thing that reaches the internet" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="596" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">Local-first</text><text x="44" y="102" font-size="23" fill="#334e68">What stays in the car, what goes home, and the one thing that reaches the internet</text><rect x="40" y="160" width="420" height="400" rx="18" fill="#f8fafc" stroke="#bcccdc" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="194" font-size="22" font-weight="700" fill="#627d98" letter-spacing="0.5">IN YOUR CAR</text><rect x="500" y="160" width="360" height="400" rx="18" fill="#f8fafc" stroke="#bcccdc" stroke-width="2" stroke-dasharray="8 6"/><text x="520" y="194" font-size="22" font-weight="700" fill="#627d98" letter-spacing="0.5">AT HOME</text><rect x="900" y="160" width="260" height="400" rx="18" fill="#f8fafc" stroke="#bcccdc" stroke-width="2" stroke-dasharray="8 6"/><text x="920" y="194" font-size="22" font-weight="700" fill="#627d98" letter-spacing="0.5">INTERNET</text><rect x="65" y="220" width="370" height="130" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="250.0" y="259.1" data-w="370" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">ESP32-S3 board</text><text x="250.0" y="296.1" data-w="370" text-anchor="middle" font-size="24" fill="#334e68">the AI model runs here,</text><text x="250.0" y="327.1" data-w="370" text-anchor="middle" font-size="24" fill="#334e68">no network needed</text><rect x="65" y="400" width="370" height="120" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="250.0" y="434.1" data-w="370" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">SD card</text><text x="250.0" y="471.1" data-w="370" text-anchor="middle" font-size="24" fill="#334e68">plain CSV, JSON</text><text x="250.0" y="502.1" data-w="370" text-anchor="middle" font-size="24" fill="#334e68">and text files</text><rect x="525" y="220" width="310" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="680.0" y="274.6" data-w="310" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Your computer</text><text x="680.0" y="311.6" data-w="310" text-anchor="middle" font-size="24" fill="#334e68">desktop app, Dashy</text><rect x="920" y="220" width="220" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="1030.0" y="259.1" data-w="220" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Time server</text><text x="1030.0" y="296.1" data-w="220" text-anchor="middle" font-size="24" fill="#334e68">public, sets</text><text x="1030.0" y="327.1" data-w="220" text-anchor="middle" font-size="24" fill="#334e68">the clock</text><path d="M 250 350 L 250 398" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 435 285 L 523 285" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="479" y="272" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">drives</text><text x="680" y="400" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">Over TLS, and only</text><text x="680" y="430" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">from a board you</text><text x="680" y="460" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">paired. Wi-Fi is</text><text x="680" y="490" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">optional and can be</text><text x="680" y="520" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">compiled out.</text><path d="M 400 220 L 400 136 L 1100 136 L 1100 218" fill="none" stroke="#627d98" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ah)"/><text x="1000" y="128" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">clock only</text><text x="1030" y="420" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">No account,</text><text x="1030" y="450" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">no upload,</text><text x="1030" y="480" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">no telemetry.</text></svg>
</body></html>
