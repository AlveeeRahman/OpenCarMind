<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>How CarMind R.E.V learns on the board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-label="How CarMind R.E.V learns on the board: Each learner changes only when the car gives it something to check against." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="1056" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">How CarMind R.E.V learns on the board</text><text x="44" y="102" font-size="23" fill="#334e68">Each learner changes only when the car gives it something to check against.</text><text x="40" y="160" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">FUEL ESTIMATE</text><rect x="40" y="180" width="300" height="180" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="228.6" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fuel label</text><text x="190.0" y="265.6" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">5 s average of the</text><text x="190.0" y="296.6" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">fuel rate the car</text><text x="190.0" y="327.6" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">reports</text><rect x="440" y="180" width="290" height="180" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="585.0" y="213.1" data-w="290" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fuel learner</text><text x="585.0" y="250.1" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">a small linear layer</text><text x="585.0" y="281.1" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">on the network's</text><text x="585.0" y="312.1" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">features; old rows</text><text x="585.0" y="343.1" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">slowly fade</text><rect x="830" y="180" width="330" height="180" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="995.0" y="213.1" data-w="330" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Check</text><text x="995.0" y="250.1" data-w="330" text-anchor="middle" font-size="24" fill="#334e68">against rows held back:</text><text x="995.0" y="281.1" data-w="330" text-anchor="middle" font-size="24" fill="#334e68">better: used live</text><text x="995.0" y="312.1" data-w="330" text-anchor="middle" font-size="24" fill="#334e68">worse: old one kept</text><text x="995.0" y="343.1" data-w="330" text-anchor="middle" font-size="24" fill="#334e68">drifted: factory reset</text><path d="M 340 270 L 438 270" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="389" y="257" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">pair</text><path d="M 730 270 L 828 270" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="779" y="228" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">now and</text><text x="779" y="254" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">then</text><text x="40" y="430" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">AIRFLOW</text><rect x="40" y="450" width="300" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="489.1" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Engine load</text><text x="190.0" y="526.1" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">and rpm, while the</text><text x="190.0" y="557.1" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">airflow sensor works</text><rect x="440" y="450" width="290" height="130" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="585.0" y="504.6" data-w="290" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Airflow constant</text><text x="585.0" y="541.6" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">one number per car</text><path d="M 340 515 L 438 515" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="40" y="650" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">FILL-UPS</text><rect x="40" y="670" width="300" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="709.1" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fuel page</text><text x="190.0" y="746.1" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">in the desktop app:</text><text x="190.0" y="777.1" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">litres you pumped</text><rect x="440" y="670" width="290" height="130" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="585.0" y="709.1" data-w="290" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Correction</text><text x="585.0" y="746.1" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">scales fuel totals,</text><text x="585.0" y="777.1" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">both models</text><path d="M 340 735 L 438 735" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="389" y="722" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">USB</text><text x="40" y="870" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">AIRFLOW SENSOR MISSING</text><rect x="40" y="890" width="260" height="120" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="170.0" y="939.6" data-w="260" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">No fuel rate,</text><text x="170.0" y="976.6" data-w="260" text-anchor="middle" font-size="24" fill="#334e68">no airflow</text><rect x="390" y="890" width="770" height="120" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="775.0" y="939.6" data-w="770" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Pick the estimate with the lowest running error</text><text x="775.0" y="976.6" data-w="770" text-anchor="middle" font-size="24" fill="#334e68">factory, learned or airflow model; shown in amber</text><path d="M 300 950 L 388 950" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 730 515 L 790 515 L 790 888" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="805" y="780" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">airflow</text><text x="805" y="806" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">model</text><path d="M 995 360 L 995 888" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="1010" y="610" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">learned</text><text x="1010" y="636" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">estimate</text><text x="600" y="1042" text-anchor="middle" font-size="20" font-weight="400" fill="#334e68">Saved to the SD card every 5 minutes while driving and when the drive ends. Safe mode turns learning off.</text></svg>
</body></html>
