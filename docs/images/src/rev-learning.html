<!doctype html><html lang="en"><head><meta charset="utf-8"><title>How CarMind R.E.V keeps learning in the car</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet"><style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-label="How CarMind R.E.V keeps learning in the car: On-device fine-tuning: the network stays frozen and small parts learn from your car." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="1596" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">How CarMind R.E.V keeps learning in the car</text><text x="44" y="102" font-size="23" fill="#334e68">On-device fine-tuning: the network stays frozen and small parts learn from your car.</text><text x="40" y="160" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">WHAT LEARNS ON THE BOARD IN v1</text><rect x="40" y="180" width="300" height="300" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="289.0" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">R.E.V network</text><text x="190.0" y="326.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">frozen on the board:</text><text x="190.0" y="357.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">5 s of OBD data in,</text><text x="190.0" y="388.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">64 features out</text><rect x="430" y="180" width="730" height="60" rx="14" fill="#eef1f4" stroke="#9fb3c8" stroke-width="2.5"/><text x="450" y="219.0" data-w="730" data-row="430,730" data-side="l" font-size="27" font-weight="700" fill="#102a43">Manoeuvre class</text><text x="1140" y="219.0" data-w="730" data-row="430,730" data-side="r" text-anchor="end" font-size="24" fill="#627d98">fixed in v1</text><path d="M 340 330 L 428 210" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><rect x="430" y="260" width="730" height="60" rx="14" fill="#eef1f4" stroke="#9fb3c8" stroke-width="2.5"/><text x="450" y="299.0" data-w="730" data-row="430,730" data-side="l" font-size="27" font-weight="700" fill="#102a43">Brake pressure</text><text x="1140" y="299.0" data-w="730" data-row="430,730" data-side="r" text-anchor="end" font-size="24" fill="#627d98">fixed in v1</text><path d="M 340 330 L 428 290" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><rect x="430" y="340" width="730" height="60" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2.5" stroke-dasharray="10 7"/><text x="450" y="379.0" data-w="730" data-row="430,730" data-side="l" font-size="27" font-weight="700" fill="#102a43">Engine torque</text><text x="1140" y="379.0" data-w="730" data-row="430,730" data-side="r" text-anchor="end" font-size="24" fill="#b45309">being added: physics as teacher</text><path d="M 340 330 L 428 370" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><rect x="430" y="420" width="730" height="60" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="450" y="459.0" data-w="730" data-row="430,730" data-side="l" font-size="27" font-weight="700" fill="#102a43">Fuel rate</text><text x="1140" y="459.0" data-w="730" data-row="430,730" data-side="r" text-anchor="end" font-size="24" fill="#334e68">linear read-out, fine-tuned</text><path d="M 340 330 L 428 450" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="40" y="560" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">FUEL READ-OUT, FINE-TUNED</text><rect x="40" y="580" width="300" height="200" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="639.0" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fuel label</text><text x="190.0" y="676.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">5 s mean of the</text><text x="190.0" y="707.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">car's fuel rate, or</text><text x="190.0" y="738.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">fuel from airflow</text><rect x="430" y="580" width="300" height="200" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="580.0" y="639.0" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Refit the read-out</text><text x="580.0" y="676.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">least squares on</text><text x="580.0" y="707.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">feature and label</text><text x="580.0" y="738.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">pairs; old rows fade</text><rect x="820" y="580" width="340" height="200" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="990.0" y="623.5" data-w="340" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Check, then swap</text><text x="990.0" y="660.5" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">on held-back rows:</text><text x="990.0" y="691.5" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">better and near factory:</text><text x="990.0" y="722.5" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">goes live; else kept;</text><text x="990.0" y="753.5" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">behind factory: reset</text><path d="M 340 680 L 428 680" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="384" y="668" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">pair</text><path d="M 730 680 L 818 680" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="774" y="668" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">refit</text><text x="40" y="860" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">AIRFLOW CONSTANT</text><rect x="40" y="880" width="300" height="160" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="934.5" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Load and rpm</text><text x="190.0" y="971.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">while the airflow</text><text x="190.0" y="1002.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">sensor (MAF) works</text><rect x="430" y="880" width="300" height="160" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="580.0" y="919.0" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Airflow constant</text><text x="580.0" y="956.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">one k per car: airflow</text><text x="580.0" y="987.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">≈ k × absolute load</text><text x="580.0" y="1018.0" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">× rpm</text><path d="M 340 960 L 428 960" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><rect x="820" y="880" width="340" height="220" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="990.0" y="918.0" data-w="340" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">No fuel rate, no MAF</text><text x="990.0" y="955.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">the board shows the</text><text x="990.0" y="986.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">estimate with the</text><text x="990.0" y="1017.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">lowest running error:</text><text x="990.0" y="1048.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">factory, learned or</text><text x="990.0" y="1079.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">airflow, in amber</text><path d="M 730 960 L 818 960" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="774" y="948" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">airflow</text><path d="M 990 780 L 990 878" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="1005" y="825" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">learned</text><text x="40" y="1160" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">FILL-UPS, BOTH MODELS</text><rect x="40" y="1180" width="300" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="1219.5" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fuel page</text><text x="190.0" y="1256.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">in the desktop app:</text><text x="190.0" y="1287.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">litres you pumped</text><rect x="430" y="1180" width="300" height="130" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="580.0" y="1219.5" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fill-up calibration</text><text x="580.0" y="1256.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">one factor for every</text><text x="580.0" y="1287.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">fuel figure</text><path d="M 340 1245 L 428 1245" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="384" y="1233" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">USB</text><text x="40" y="1380" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">FUEL TANK, BEING ADDED</text><rect x="40" y="1400" width="300" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="190.0" y="1439.5" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Fuel level %</text><text x="190.0" y="1476.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">its drop against</text><text x="190.0" y="1507.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">the fuel used</text><rect x="430" y="1400" width="300" height="130" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2.5" stroke-dasharray="10 7"/><text x="580.0" y="1439.5" data-w="300" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Tank size</text><text x="580.0" y="1476.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">litres left, range,</text><text x="580.0" y="1507.5" data-w="300" text-anchor="middle" font-size="24" fill="#334e68">fill-up detection</text><path d="M 340 1465 L 428 1465" fill="none" stroke="#627d98" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ah)"/><rect x="820" y="1180" width="340" height="350" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="990.0" y="1252.0" data-w="340" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Kept and saved</text><text x="990.0" y="1289.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">on the SD card every</text><text x="990.0" y="1320.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">5 min while driving</text><text x="990.0" y="1351.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">and at drive end;</text><text x="990.0" y="1382.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">about 2 % of one core,</text><text x="990.0" y="1413.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">below the OBD poll</text><text x="990.0" y="1444.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">and the model; safe</text><text x="990.0" y="1475.0" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">mode turns it off</text><text x="600" y="1575" text-anchor="middle" font-size="21" font-weight="400" fill="#334e68">Dashed: being added in this release, not yet in the firmware. Grey: fixed in v1.</text></svg>
