<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clock over Wi-Fi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Clock over Wi-Fi: one HTTPS request to one verified time server" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="696" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">Clock over Wi-Fi</text><text x="44" y="102" font-size="23" fill="#334e68">The one thing the board asks the internet for: the time, from one verified server.</text><rect x="170" y="140" width="260" height="64" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="300.0" y="181.0" data-w="260" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Board</text><rect x="770" y="140" width="260" height="64" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="900.0" y="181.0" data-w="260" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Time server</text><path d="M300 204 V610 M900 204 V610" stroke="#bcccdc" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="60" y="225" width="250" height="50" rx="12" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2"/><text x="175.0" y="258.0" data-w="250" text-anchor="middle" font-size="21" fill="#334e68">parked, known Wi-Fi</text><path d="M 302 320 L 898 320" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="307" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">HTTPS request to the one host name (default or your choice)</text><path d="M 898 390 L 302 390" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="377" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">certificate: must chain to a trusted root and name that host</text><path d="M 898 460 L 302 460" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="447" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">reply with a Date header</text><rect x="60" y="500" width="250" height="50" rx="12" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2"/><text x="175.0" y="533.0" data-w="250" text-anchor="middle" font-size="21" fill="#334e68">time in 2026-2099?</text><rect x="60" y="560" width="250" height="50" rx="12" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2"/><text x="175.0" y="593.0" data-w="250" text-anchor="middle" font-size="21" fill="#334e68">set clock, else refuse</text><text x="600" y="660" text-anchor="middle" font-size="22" fill="#334e68">No SNTP, no upload, no open port. Drives reach the desktop app over the USB cable.</text></svg>
</body></html>
