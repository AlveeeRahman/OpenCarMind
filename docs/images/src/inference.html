<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>On-board inference</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="On-board inference: Each OBD row starts one model run in its own task. Logging never waits for it." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="636" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">On-board inference</text><text x="44" y="102" font-size="23" fill="#334e68">Each OBD row starts one model run in its own task. Logging never waits for it.</text><rect x="40" y="160" width="190" height="180" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="135.0" y="208.6" data-w="190" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">OBD row</text><text x="135.0" y="245.6" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">arrives every</text><text x="135.0" y="276.6" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">1 to 2 s, with</text><text x="135.0" y="307.6" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">its time</text><rect x="320" y="160" width="250" height="180" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="445.0" y="208.6" data-w="250" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">5 s window</text><text x="445.0" y="245.6" data-w="250" text-anchor="middle" font-size="24" fill="#334e68">five 1-second</text><text x="445.0" y="276.6" data-w="250" text-anchor="middle" font-size="24" fill="#334e68">bins, latest value,</text><text x="445.0" y="307.6" data-w="250" text-anchor="middle" font-size="24" fill="#334e68">held up to 3 s</text><rect x="660" y="160" width="230" height="180" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="775.0" y="208.6" data-w="230" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Model task</text><text x="775.0" y="245.6" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">E.V or R.E.V,</text><text x="775.0" y="276.6" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">one at a time;</text><text x="775.0" y="307.6" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">E.V: 3.5 ms</text><rect x="960" y="140" width="200" height="100" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="1060.0" y="180.2" data-w="200" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">.ml.csv</text><text x="1060.0" y="214.2" data-w="200" text-anchor="middle" font-size="21" fill="#334e68">a line per row</text><rect x="960" y="255" width="200" height="100" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="1060.0" y="295.2" data-w="200" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">Screen</text><text x="1060.0" y="329.2" data-w="200" text-anchor="middle" font-size="21" fill="#334e68">page 5, economy</text><rect x="960" y="370" width="200" height="100" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="1060.0" y="410.2" data-w="200" text-anchor="middle" font-size="24" font-weight="700" fill="#102a43">R.E.V learner</text><text x="1060.0" y="444.2" data-w="200" text-anchor="middle" font-size="21" fill="#334e68">learns fuel use</text><path d="M 230 250 L 318 250" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="274" y="237" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">binned</text><path d="M 570 250 L 658 250" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="614" y="237" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">queued</text><path d="M 890 215 L 958 190" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 890 250 L 958 300" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 890 300 L 925 300 L 925 420 L 958 420" fill="none" stroke="#627d98" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ah)"/><path d="M 135 340 L 135 530 L 300 530" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="315" y="524" text-anchor="start" font-size="22" font-weight="400" fill="#334e68">The OBD task goes straight back to logging the row and polling the next.</text><text x="315" y="566" text-anchor="start" font-size="22" font-weight="400" fill="#334e68">With no fuel rate or airflow from the car, the model's fuel estimate</text><text x="315" y="596" text-anchor="start" font-size="22" font-weight="400" fill="#334e68">fills the economy tile, in amber.</text></svg>
</body></html>
