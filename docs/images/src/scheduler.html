<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scheduler and safety</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Scheduler and safety: Every job is timed against a deadline, learning gets a capped budget, and a hang cannot stop logging" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="716" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">Scheduler and safety</text><text x="44" y="102" font-size="23" fill="#334e68">Every job is timed against a deadline, learning gets a capped budget, and a hang cannot stop logging</text><text x="40" y="160" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">JOBS</text><text x="470" y="160" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">MEASURED</text><text x="880" y="160" font-size="22" font-weight="700" fill="#627d98" letter-spacing="1">RECOVERY</text><rect x="40" y="180" width="340" height="110" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="210.0" y="224.6" data-w="340" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">OBD poll</text><text x="210.0" y="261.6" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">periodic, with a deadline</text><rect x="40" y="310" width="340" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="210.0" y="349.1" data-w="340" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Model</text><text x="210.0" y="386.1" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">paced by the car's rows,</text><text x="210.0" y="417.1" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">checked per 10 s window</text><rect x="40" y="460" width="340" height="180" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="210.0" y="493.1" data-w="340" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">R.E.V learning</text><text x="210.0" y="530.1" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">about 2 % of one core;</text><text x="210.0" y="561.1" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">waits for its budget and</text><text x="210.0" y="592.1" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">skips rows rather than</text><text x="210.0" y="623.1" data-w="340" text-anchor="middle" font-size="24" fill="#334e68">delay a poll</text><rect x="470" y="180" width="320" height="160" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="630.0" y="218.6" data-w="320" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Every run</text><text x="630.0" y="255.6" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">response time,</text><text x="630.0" y="286.6" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">CPU time, misses</text><text x="630.0" y="317.6" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">and stalls</text><rect x="470" y="420" width="320" height="220" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="630.0" y="473.1" data-w="320" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Once a minute</text><text x="630.0" y="510.1" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">per-core load vs the</text><text x="630.0" y="541.1" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">rate-monotonic bound;</text><text x="630.0" y="572.1" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">worst-case response</text><text x="630.0" y="603.1" data-w="320" text-anchor="middle" font-size="24" fill="#334e68">time of each job</text><rect x="880" y="180" width="280" height="130" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="1020.0" y="219.1" data-w="280" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">A step hangs</text><text x="1020.0" y="256.1" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">the watchdog</text><text x="1020.0" y="287.1" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">restarts the board</text><rect x="880" y="350" width="280" height="100" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="1020.0" y="389.6" data-w="280" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">3 bad restarts</text><text x="1020.0" y="426.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">in a row</text><rect x="880" y="490" width="280" height="150" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="1020.0" y="539.1" data-w="280" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Safe mode</text><text x="1020.0" y="576.1" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">model and learning</text><text x="1020.0" y="607.1" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">off, logging on</text><path d="M 380 235 L 468 240" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 380 375 L 468 290" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 380 550 L 425 550 L 425 320 L 468 320" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 630 340 L 630 418" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="645" y="386" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">each minute</text><path d="M 1020 310 L 1020 348" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 1020 450 L 1020 488" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="690" text-anchor="middle" font-size="22" font-weight="400" fill="#334e68">Drives are saved every 10 s and close 15 s after the engine stops answering.</text></svg>
</body></html>
