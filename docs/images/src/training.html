<!doctype html><html lang="en"><head><meta charset="utf-8"><title>How the models are made</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet"><style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="How the models are made: Off the board, once per release, in a private repository. The board only runs the result." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="736" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">How the models are made</text><text x="44" y="102" font-size="23" fill="#334e68">Off the board, once per release, in a private repository. The board only runs the result.</text><rect x="40" y="150" width="260" height="200" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="170.0" y="209.0" data-w="260" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Drive data</text><text x="170.0" y="246.0" data-w="260" text-anchor="middle" font-size="24" fill="#334e68">public datasets</text><text x="170.0" y="277.0" data-w="260" text-anchor="middle" font-size="24" fill="#334e68">plus drives</text><text x="170.0" y="308.0" data-w="260" text-anchor="middle" font-size="24" fill="#334e68">of my own car</text><rect x="335" y="150" width="290" height="200" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="480.0" y="193.5" data-w="290" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Train E.V (QAT)</text><text x="480.0" y="230.5" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">quantisation-aware</text><text x="480.0" y="261.5" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">training: the chip's</text><text x="480.0" y="292.5" data-w="290" text-anchor="middle" font-size="24" fill="#334e68">integer rounding is</text><text x="480.0" y="323.5" data-w="290" t nd="url(#ah)"/><path d="M 625 250.0 L 658 250.0" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 625 540.0 L 658 540.0" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 900 250.0 L 938 250.0" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 900 540.0 L 938 540.0" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 375 350 L 375 390 L 170 390 L 170 438" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="272" y="382" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">E.V's design</text><path d="M 520 350 L 520 438" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="535" y="402" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">teacher</text><text x="600" y="700" text-anchor="middle" font-size="21" font-weight="400" fill="#334e68">Tested with the airflow reading hidden because that is the case R.E.V's learners on the board exist for.</text></svg>
