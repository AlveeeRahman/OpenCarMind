<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>How the models are made</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#ffffff}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="How the models are made: Off the board, once per release. The board only runs the result." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627d98"/></marker></defs><rect x="2" y="2" width="1196" height="616" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/><text x="44" y="62" font-size="36" font-weight="800" fill="#102a43">How the models are made</text><text x="44" y="102" font-size="23" fill="#334e68">Off the board, once per release. The board only runs the result.</text><rect x="40" y="160" width="220" height="160" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="150.0" y="198.6" data-w="220" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Drive data</text><text x="150.0" y="235.6" data-w="220" text-anchor="middle" font-size="24" fill="#334e68">public datasets</text><text x="150.0" y="266.6" data-w="220" text-anchor="middle" font-size="24" fill="#334e68">plus the author's</text><text x="150.0" y="297.6" data-w="220" text-anchor="middle" font-size="24" fill="#334e68">own car</text><rect x="330" y="160" width="280" height="160" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="470.0" y="198.6" data-w="280" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Train E.V</text><text x="470.0" y="235.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">a 1-D convolutional</text><text x="470.0" y="266.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">network, trained</text><text x="470.0" y="297.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">quantisation-aware</text><rect x="680" y="160" width="230" height="160" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="795.0" y="214.1" data-w="230" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Test</text><text x="795.0" y="251.1" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">held-out drives,</text><text x="795.0" y="282.1" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">cars never seen</text><rect x="970" y="160" width="190" height="160" rx="14" fill="#e6f6f4" stroke="#0f766e" stroke-width="2.5"/><text x="1065.0" y="212.6" data-w="190" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">CarMind E.V</text><text x="1065.0" y="249.6" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">about 89 KB</text><text x="1065.0" y="280.6" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">on the chip</text><rect x="330" y="400" width="280" height="160" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="470.0" y="438.6" data-w="280" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Make it smaller</text><text x="470.0" y="475.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">pruned to about</text><text x="470.0" y="506.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">half, retrained with</text><text x="470.0" y="537.6" data-w="280" text-anchor="middle" font-size="24" fill="#334e68">E.V as the teacher</text><rect x="680" y="400" width="230" height="160" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2.5"/><text x="795.0" y="454.1" data-w="230" text-anchor="middle" font-size="27" font-weight="700" fill="#102a43">Test</text><text x="795.0" y="491.1" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">cars never seen,</text><text x="795.0" y="522.1" data-w="230" text-anchor="middle" font-size="24" fill="#334e68">airflow hidden</text><rect x="970" y="400" width="190" height="160" rx="14" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/><text x="1065.0" y="437.1" data-w="190" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">CarMind R.E.V</text><text x="1065.0" y="474.1" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">plus the</text><text x="1065.0" y="505.1" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">learners on</text><text x="1065.0" y="536.1" data-w="190" text-anchor="middle" font-size="24" fill="#334e68">the board</text><path d="M 260 240 L 328 240" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 610 240 L 678 240" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 910 240 L 968 240" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 470 320 L 470 398" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="485" y="366" text-anchor="start" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">teacher</text><path d="M 150 320 L 150 480 L 328 480" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><text x="240" y="450" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">more public</text><text x="240" y="476" text-anchor="middle" font-size="21" fill="#627d98" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">drives</text><path d="M 610 480 L 678 480" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 910 480 L 968 480" fill="none" stroke="#627d98" stroke-width="2.5" marker-end="url(#ah)"/></svg>
</body></html>
