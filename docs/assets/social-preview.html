<!doctype html>
<!--
  Source for docs/assets/social-preview.png (1280x640, the size GitHub asks for).
  Re-render from the repository root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
      --window-size=1280,640 --screenshot=docs/assets/social-preview.png docs/assets/social-preview.html
  Then upload the PNG in GitHub: Settings > General > Social preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; width:1280px; height:640px; overflow:hidden; }
  body { position:relative; background:#0B0F14; color:#E5E7EB; font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display:grid; grid-template-columns:1fr 520px; gap:40px; padding:64px 72px 0; box-sizing:border-box; }
  body::before { content:""; position:absolute; right:-60px; top:20px; width:680px; height:680px;
                 background:radial-gradient(closest-side, rgba(34,211,238,.20), rgba(34,211,238,0)); }
  .title { display:flex; align-items:center; gap:22px; margin:0 0 18px; }
  .title img { width:88px; height:88px; border-radius:20px; }
  h1 { font-size:64px; margin:0; letter-spacing:-.02em; }
  .lead { font-size:30px; line-height:1.3; color:#E5E7EB; margin:0 0 26px; }
  ul { list-style:none; padding:0; margin:0; font-size:22px; color:#9AA4B0; }
  li { margin:0 0 12px; } li b { color:#22D3EE; font-weight:600; }
  .url { position:absolute; left:72px; bottom:40px; font-size:20px; color:#9AA4B0; }
  .screens { position:relative; display:flex; gap:16px; align-items:flex-start; margin-top:6px; }
  .screens img { width:160px; border-radius:12px; border:1px solid #26303B; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .screens img:nth-child(2) { margin-top:40px; } .screens img:nth-child(3) { margin-top:80px; }
</style>
</head>
<body>
  <div>
    <div class="title"><img src="icon.png" alt=""><h1>OpenCarMind</h1></div>
    <p class="lead">ESP32-S3 OBD-II logger with a neural network on the chip</p>
    <ul>
      <li><b>93 KB model</b>, about 9 ms per run</li>
      <li><b>Bluetooth LE</b> ELM327 adapters</li>
      <li><b>No phone, no account, no cloud</b></li>
      <li><b>Open source</b>, MIT licence</li>
    </ul>
  </div>
  <div class="screens">
    <img src="../images/dash.png" alt="">
    <img src="../images/faults.png" alt="">
    <img src="../images/system.png" alt="">
  </div>
  <div class="url">alveeerahman.github.io/OpenCarMind</div>
</body>
</html>
