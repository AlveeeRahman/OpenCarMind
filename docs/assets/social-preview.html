<!doctype html>
<!--
  Source for docs/assets/social-preview.png (1280x640, the size GitHub asks for).
  Re-render from the repository root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1280,640 --virtual-time-budget=8000 --screenshot=docs/assets/social-preview.png "file://$PWD/docs/assets/social-preview.html"
  Then upload the PNG in GitHub: Settings > General > Social preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; width:1280px; height:640px; overflow:hidden; }
  body { position:relative; background:#15202D; color:#F2ECE1; font-family:'IBM Plex Sans', system-ui, sans-serif;
         display:grid; grid-template-columns:1fr 540px; gap:32px; padding:64px 64px 0 72px; box-sizing:border-box; }
  .title { display:flex; align-items:center; gap:22px; margin:0 0 22px; }
  .title img { width:92px; height:92px; }
  h1 { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:66px; line-height:1; margin:0; letter-spacing:-.01em; }
  h1 span { color:#F59A2E; }
  .lead { font-size:29px; line-height:1.3; margin:0 0 28px; }
  ul { list-style:none; padding:0; margin:0; font-size:22px; color:#9DA8B8; }
  li { margin:0 0 13px; display:flex; align-items:center; gap:12px; }
  li b { color:#F2ECE1; font-weight:600; }
  li img { width:34px; height:34px; }
  .url { position:absolute; left:72px; bottom:38px; font-size:20px; color:#9DA8B8; }
  .screens { display:flex; gap:16px; align-items:flex-start; margin-top:4px; }
  .screens img { width:166px; border-radius:12px; border:1.5px solid #34465C; }
  .screens img:nth-child(2) { margin-top:40px; } .screens img:nth-child(3) { margin-top:80px; }
</style>
</head>
<body>
  <div>
    <div class="title"><img src="../../assets/logo/opencarmind-logo.svg" alt=""><h1><span>Open</span>CarMind</h1></div>
    <p class="lead">Open-source OBD2 logger for the ESP32,<br>with TinyML on the chip</p>
    <ul>
      <li><img src="carmind-rev.svg" alt=""><span><b>CarMind R.E.V</b>, 66 KB, keeps learning your car</span></li>
      <li><img src="carmind-ev.svg" alt=""><span><b>CarMind E.V</b>, 89 KB, fixed and tested</span></li>
      <li><span><b>Bluetooth LE</b> ELM327 adapters. No phone, no account, no cloud</span></li>
      <li><span><b>Open source</b>, MIT licence</span></li>
    </ul>
  </div>
  <div class="screens">
    <img src="../images/dash.png" alt="">
    <img src="../images/faults.png" alt="">
    <img src="../images/system-rev.png" alt="">
  </div>
  <div class="url">alveeerahman.github.io/OpenCarMind</div>
</body>
</html>
